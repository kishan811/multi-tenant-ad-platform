services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adpipeline
      POSTGRES_PASSWORD: adpipeline
      POSTGRES_DB: adpipeline
    ports:
      - "5433:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpipeline"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
